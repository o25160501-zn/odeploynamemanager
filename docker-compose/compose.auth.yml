# ================================================================
#  compose.auth.yml — Auth + SQLite Backup Layer
#  Provides Tinyauth forward_auth and Litestream restore/replicate.
# ================================================================

services:
  litestream-restore:
    container_name: "litestream-restore"
    image: litestream/litestream:0.3.13
    profiles: [litestream]
    env_file:
      - ./.env
    entrypoint: ["/bin/sh", "/entrypoint.sh", "restore-only"]
    volumes:
      - ./services/litestream/litestream.yml:/etc/litestream.yml:ro
      - ./services/litestream/entrypoint.sh:/entrypoint.sh:ro
      - ${DOCKER_VOLUMES_ROOT:-./.docker-volumes}/tinyauth:/data/tinyauth
      - ${DOCKER_VOLUMES_ROOT:-./.docker-volumes}/app/data:/data/app
    restart: "no"

  litestream:
    container_name: "litestream"
    image: litestream/litestream:0.3.13
    profiles: [litestream]
    env_file:
      - ./.env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./services/litestream/litestream.yml:/etc/litestream.yml:ro
      - ./services/litestream/entrypoint.sh:/entrypoint.sh:ro
      - ${DOCKER_VOLUMES_ROOT:-./.docker-volumes}/tinyauth:/data/tinyauth
      - ${DOCKER_VOLUMES_ROOT:-./.docker-volumes}/app/data:/data/app
    depends_on:
      litestream-restore:
        condition: service_completed_successfully
    restart: unless-stopped

  tinyauth:
    container_name: "tinyauth"
    image: ghcr.io/steveiliop56/tinyauth:v5
    command:
      - "--appurl=${TINYAUTH_APP_URL:-https://auth.${DOMAIN}}"
      - "--server.port=${TINYAUTH_PORT:-3000}"
      - "--database.path=/data/${TINYAUTH_DB_FILE:-tinyauth.db}"
      - "--auth.users=${TINYAUTH_USERS:-admin:$$2a$$10$$j6BSX9Y0bt2AuNczVnizP.9sB/WAXi2V7e0LYvZdcDfiMUBFG/S5m}"
      - "--auth.securecookie=${TINYAUTH_COOKIE_SECURE:-true}"
      - "--auth.trustedproxies=${TINYAUTH_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1/32,::1/128,fc00::/7}"
      - "--oauth.autoredirect=${TINYAUTH_OAUTH_AUTO_REDIRECT:-none}"
      - "--oauth.whitelist=${TINYAUTH_ALLOWED_DOMAINS:-}"
      - "--log.level=${TINYAUTH_LOG_LEVEL:-info}"
    volumes:
      - ${DOCKER_VOLUMES_ROOT:-./.docker-volumes}/tinyauth:/data
    labels:
      - "caddy=http://auth.${PROJECT_NAME}.${DOMAIN}, http://auth.${DOMAIN}, http://auth.${PROJECT_NAME_TAILSCALE}.${TAILSCALE_TAILNET_DOMAIN}"
      - "caddy.reverse_proxy={{upstreams ${TINYAUTH_PORT:-3000}}}"
    networks: [app_net]
    depends_on:
      litestream-restore:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${TINYAUTH_PORT:-3000}/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
