services:
  domain-register-app:
    container_name: domain-register-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_API_KEY=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_API_KEY}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_AUTH_DOMAIN=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_AUTH_DOMAIN}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_PROJECT_ID=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_PROJECT_ID}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_DATABASE_URL=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_DATABASE_URL}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_STORAGE_BUCKET=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_STORAGE_BUCKET}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_MESSAGING_SENDER_ID=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_MESSAGING_SENDER_ID}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_APP_ID=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_APP_ID}
        - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_BASE64=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_BASE64}
        - DPDNS_CLOUDFLARED_MANAGER_ENCRYPT_SALT=${DPDNS_CLOUDFLARED_MANAGER_ENCRYPT_SALT}
        - DPDNS_CLOUDFLARED_MANAGER_ALLOWED_EMAILS=${DPDNS_CLOUDFLARED_MANAGER_ALLOWED_EMAILS}
        - DPDNS_CLOUDFLARED_MANAGER_LOG_LEVEL=${DPDNS_CLOUDFLARED_MANAGER_LOG_LEVEL}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DPDNS_CLOUDFLARED_MANAGER_BACKEND_API_SECRET_KEY=${DPDNS_CLOUDFLARED_MANAGER_BACKEND_API_SECRET_KEY}
      - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_SERVICE_ACCOUNT_BASE64=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_SERVICE_ACCOUNT_BASE64}
      - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_SERVICE_ACCOUNT_PATH=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_SERVICE_ACCOUNT_PATH}
      - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_BASE64=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_BASE64}
      - DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_PATH=${DPDNS_CLOUDFLARED_MANAGER_FIREBASE_CONFIG_APP_PATH}
    restart: always
